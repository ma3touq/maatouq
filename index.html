<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>ركز مع معتوق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2f5;--card:#fff;--tx:#0d2230;--mut:#5f7886;--bd:#d5e3e9;--ac:#e59400;--acx:#0d2230;--ok:#13a56b;--bad:#e0425a;--hd:#0d2230;--hdt:#f2fbff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a25;--card:#132d40;--tx:#eaf6fb;--mut:#8fb0c1;--bd:#1f4157;--ac:#ffb703;--acx:#0d2230;--ok:#3ddc97;--bad:#ff6b81;--hd:#0f2a3b;--hdt:#f2fbff}}
:root[data-theme="dark"]{--bg:#0a1a25;--card:#132d40;--tx:#eaf6fb;--mut:#8fb0c1;--bd:#1f4157;--ac:#ffb703;--acx:#0d2230;--ok:#3ddc97;--bad:#ff6b81;--hd:#0f2a3b;--hdt:#f2fbff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.55 Tajawal,"Segoe UI",Tahoma,sans-serif;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{background:var(--hd);color:var(--hdt);padding:18px 18px 22px;border-radius:0 0 28px 28px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top small{opacity:.75;font-size:13px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:0}
.ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);font-size:19px}
.prog{display:flex;align-items:center;gap:14px;margin-top:16px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),rgba(255,255,255,.15) 0);display:grid;place-items:center;flex:none}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--hd);display:grid;place-items:center;font-size:18px;font-weight:800}
.prog p{margin:0;font-size:15px;opacity:.92}
main{padding:16px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.task{display:flex;gap:12px}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);font-size:16px;line-height:1;color:var(--acx);margin-top:2px}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .tt{text-decoration:line-through;opacity:.55}
.body{flex:1;min-width:0}
.tt{font-weight:800;font-size:17px;word-break:break-word}
.meta{color:var(--mut);font-size:13px;margin-top:2px}
.late{color:var(--bad);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);text-decoration:none}
.thumb{display:block;margin-top:8px;max-width:100%;max-height:170px;border-radius:12px}
.note{font-size:14px;color:var(--mut);margin:6px 0 0}
.del{font-size:12px;color:var(--mut);margin-top:8px;padding:2px 0}
.del.sure{color:var(--bad);font-weight:800}
.empty{text-align:center;color:var(--mut);padding:44px 20px}
.empty big{display:block;font-size:44px}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;padding:6px 0;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:20px}
nav button.on{color:var(--tx);font-weight:800}
nav button.on span{transform:translateY(-2px)}
#fab{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:var(--acx);font-size:30px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:6}
#ban{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline:10px;background:var(--ac);color:var(--acx);border-radius:18px;padding:14px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#ban p{margin:2px 0 10px}
#ban button{background:var(--acx);color:#fff;border-radius:99px;padding:6px 16px;margin-inline-end:8px;font-weight:800}
#toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:30;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-size:14px}
.pill.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:800}
.chkl{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--tx);font-size:15px}
.chkl input{width:20px;height:20px;accent-color:var(--ac)}
.save{width:100%;margin-top:18px;padding:14px;border-radius:16px;background:var(--ac);color:var(--acx);font-weight:800;font-size:17px}
.cancel{width:100%;padding:10px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--ac);border-radius:8px 8px 3px 3px;min-height:4px}
.bars em{font-style:normal;color:var(--tx);font-weight:800}
.lvl{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.lvl i{display:block;height:100%;background:var(--ok)}
h3{font-size:17px}.stat b.late{color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><small id="hi"></small><h1>ركز مع معتوق 🎯</h1></div>
    <button class="ic" id="bell" aria-label="تفعيل التنبيهات">🔔</button>
  </div>
  <div class="prog">
    <div class="ring" id="ring"><b id="rp">0%</b></div>
    <p id="pt"></p>
  </div>
</header>
<main id="main"></main>
<button id="fab" aria-label="إضافة">＋</button>
<nav id="nav">
  <button data-tab="today"><span>📌</span>النهاردة</button>
  <button data-tab="next"><span>🗓️</span>القادم</button>
  <button data-tab="done"><span>✅</span>اللي خلص</button>
  <button data-tab="stats"><span>📊</span>إنجازي</button>
  <button data-tab="bud"><span>💼</span>ميزانيتي</button>
  <button data-tab="help"><span>💬</span>الدعم</button>
</nav>
<div id="ban" hidden></div>
<div id="toast" hidden></div>
<div class="ov" id="ov" hidden>
  <div class="sheet">
    <h2>إضافة جديدة</h2>
    <div class="row" id="types"></div>
    <label for="f-t">العنوان</label>
    <input type="text" id="f-t" placeholder="مثلًا: فرح أحمد، دفع الإيجار">
    <label for="f-d">الميعاد</label>
    <input type="datetime-local" id="f-d">
    <label>فكرني</label>
    <div class="chkl"><input type="checkbox" class="rm" value="day" id="r1" checked><label for="r1" style="margin:0;color:inherit;font-size:15px">اليوم اللي قبله (٦ مساءً)</label></div>
    <div class="chkl"><input type="checkbox" class="rm" value="3x" id="r2" checked><label for="r2" style="margin:0;color:inherit;font-size:15px">٣ مرات في يوم الميعاد (٩ص، ٢م، ٧م)</label></div>
    <div class="chkl"><input type="checkbox" class="rm" value="hour" id="r3"><label for="r3" style="margin:0;color:inherit;font-size:15px">قبلها بساعة</label></div>
    <div class="chkl"><input type="checkbox" checked disabled id="r4"><label for="r4" style="margin:0;color:inherit;font-size:15px">وقت الميعاد نفسه (دايمًا)</label></div>
    <label for="f-tn">نغمة التنبيه</label>
    <div class="row"><select id="f-tn" style="flex:1"></select><button class="pill" id="tp">▶ جرّبها</button></div>
    <label for="f-a">مبلغ (اختياري)</label>
    <input type="number" id="f-a" inputmode="decimal" placeholder="٠">
    <label for="f-p">المكان (اختياري)</label>
    <input type="text" id="f-p" placeholder="اسم المكان أو العنوان">
    <label for="f-n">ملاحظات</label>
    <textarea id="f-n"></textarea>
    <label for="f-f">مرفق: صورة أو ملف</label>
    <input type="file" id="f-f">
    <button class="save" id="sv">حفظ</button>
    <button class="cancel" id="cn">إلغاء</button>
  </div>
</div>
<script>
const K='maatouq.v1';
let S={tasks:[],fired:{},bud:{sal:0,ex:[],cats:[{id:'c1',n:'🏠 إيجار',l:0},{id:'c2',n:'🛒 أكل وشرب',l:0},{id:'c3',n:'🚗 مواصلات',l:0},{id:'c4',n:'💡 فواتير',l:0},{id:'c5',n:'🎬 ترفيه',l:0},{id:'c6',n:'🏦 ادخار',l:0}]}},tab='today',ty='task',ac=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('المساحة امتلأت، احذف مرفقات قديمة')}};
const TY={task:['✅','مهمة'],event:['📅','ميعاد'],party:['🎉','مناسبة'],money:['💰','مصروف']};
const TONES=[{n:'جرس',w:'sine',f:[880,1318,1760]},{n:'نبضة',w:'square',f:[440,440,660]},{n:'ناي',w:'triangle',f:[523,659,784,1046]},{n:'إنذار',w:'sawtooth',f:[660,520,660,520]},{n:'نصر',w:'triangle',f:[392,523,659,784,1046]}];
const MOT=['إنت قدها، خلّصها وارتاح 💪','خطوة صغيرة النهاردة بتفرق بكرة 🚀','معتوق واثق فيك، يلا بينا! 🔥','الإنجاز بيبدأ بقرار، خدّه دلوقتي ✨','إنجاز كمان وتبقى بطل اليوم 🏆','ركّز، ماتسيبش حاجة تفلت منك 🎯'];
const PRAISE=['برافو! 🎉','يا بطل! 🏆','ولا أروع 🔥','واحدة كمان خلصت ✨'];
const DL=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DS=['ح','ن','ث','ر','خ','ج','س'];
const fmt=x=>new Date(x).toLocaleString('ar-EG',{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'});
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return +x};
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function play(n){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const T=TONES[n]||TONES[0],t0=ac.currentTime;T.f.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=t0+i*.2;o.type=T.w;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.25,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+.45);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.5)})}catch(e){}}
function sched(t){if(!t.due)return[];const d=t.due,day=sod(d),r=[];
 if(t.rem.includes('day'))r.push([day-864e5+18*36e5,'بكره: ']);
 if(t.rem.includes('3x'))[9,14,19].forEach(h=>{const x=day+h*36e5;if(x<d)r.push([x,'النهاردة: '])});
 if(t.rem.includes('hour'))r.push([d-36e5,'كمان ساعة: ']);
 r.push([d,'دلوقتي: ']);return r}
function banner(t,p){const e=$('#ban'),m=MOT[Math.random()*MOT.length|0];
 e.innerHTML='<b>'+esc(p+t.title)+'</b><p>'+esc(m)+'</p><button data-act="done" data-id="'+t.id+'">تم ✓</button><button data-act="close">لاحقًا</button>';e.hidden=false;
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}
 try{if(Notification.permission==='granted')new Notification('ركز مع معتوق 🔔',{body:p+t.title+'\n'+m})}catch(x){}}
function tick(){const now=Date.now();let ch=0;
 S.tasks.forEach(t=>{if(t.done)return;sched(t).forEach(([ts,p],i)=>{const k=t.id+'_'+i;if(ts<=now&&now-ts<864e5&&!S.fired[k]){S.fired[k]=1;ch=1;play(t.tone);banner(t,p)}})});
 if(ch){save();render()}}
function stats(){const d=S.tasks.filter(t=>t.done),now=new Date(),ws=new Date(now);ws.setHours(0,0,0,0);ws.setDate(ws.getDate()-((ws.getDay()+1)%7));
 const ms=new Date(now.getFullYear(),now.getMonth(),1),me=new Date(now.getFullYear(),now.getMonth()+1,1),today=sod(now);
 const days=[...Array(7)].map((_,i)=>{const s=today-(6-i)*864e5;return{l:DS[new Date(s).getDay()],n:d.filter(t=>t.doneAt>=s&&t.doneAt<s+864e5).length}});
 let st=0,i=days[6].n?0:1;for(;i<400;i++){const s=today-i*864e5;if(d.some(t=>t.doneAt>=s&&t.doneAt<s+864e5))st++;else break}
 const spend=S.tasks.filter(t=>t.amt&&(t.due||t.created)>=ms&&(t.due||t.created)<me).reduce((a,t)=>a+t.amt,0);
 return{w:d.filter(t=>t.doneAt>=ws).length,m:d.filter(t=>t.doneAt>=ms).length,all:d.length,total:S.tasks.length,days,st,spend}}
function card(t){const late=!t.done&&t.due&&t.due<Date.now(),a=t.att;
 return '<div class="card task'+(t.done?' done':'')+'" data-id="'+t.id+'"><button class="chk" data-act="done" data-id="'+t.id+'" aria-label="تم">'+(t.done?'✓':'')+'</button><div class="body"><div class="tt">'+TY[t.type][0]+' '+esc(t.title)+'</div>'+
 (t.due?'<div class="meta'+(late?' late':'')+'">'+(late?'فات ميعادها · ':'')+fmt(t.due)+'</div>':'')+
 '<div class="chips">'+(t.amt?'<span class="chip">💰 '+t.amt.toLocaleString('ar-EG')+' ج</span>':'')+
 (t.place?'<a class="chip" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(t.place)+'">📍 '+esc(t.place)+'</a>':'')+
 '<span class="chip">🔔 '+TONES[t.tone].n+'</span>'+
 (a&&!a.img?'<button class="chip" data-act="file" data-id="'+t.id+'">📎 '+esc(a.name)+'</button>':'')+'</div>'+
 (a&&a.img?'<img class="thumb" alt="'+esc(a.name)+'" src="'+a.data+'">':'')+
 (t.note?'<p class="note">'+esc(t.note)+'</p>':'')+
 '<button class="del" data-act="del" data-id="'+t.id+'">🗑 حذف</button></div></div>'}
function render(){
 const now=Date.now(),eod=sod(now)+864e5,T=S.tasks,h=new Date().getHours();
 $('#hi').textContent=(h<12?'صباح الخير':h<18?'نهارك سعيد':'مساء الخير')+' يا '+'بطل';
 const td=T.filter(t=>t.due&&t.due<eod&&(!t.done||(t.doneAt>=eod-864e5)));
 const dn=td.filter(t=>t.done).length,p=td.length?Math.round(dn/td.length*100):0;
 $('#ring').style.setProperty('--p',p);$('#rp').textContent=p+'%';
 $('#pt').textContent=!td.length?'مفيش حاجة النهاردة. ضيف أول مهمة 👇':dn===td.length?'خلصت كل حاجة النهاردة! معتوق فخور بيك 🏆':'خلّصت '+dn+' من '+td.length+'. فاضل '+(td.length-dn)+'، كمّل!';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 let L=[],e='';
 if(tab==='today'){L=T.filter(t=>!t.done&&t.due&&t.due<eod).sort((a,b)=>a.due-b.due);e='🌤️|يومك فاضي. ضيف مهمة أو ميعاد بالزرار تحت'}
 if(tab==='next'){L=T.filter(t=>!t.done&&(!t.due||t.due>=eod)).sort((a,b)=>(a.due||9e15)-(b.due||9e15));e='🗓️|مفيش حاجة جاية. ضيف ميعاد فرح أو مهمة'}
 if(tab==='done'){L=T.filter(t=>t.done).sort((a,b)=>b.doneAt-a.doneAt);e='🎯|لسه ماخلصتش حاجة. أول إنجاز مستنيك'}
 if(tab==='stats')return renderStats();if(tab==='bud')return renderBud();if(tab==='help')return renderHelp();
 $('#main').innerHTML=L.length?L.map(card).join(''):'<div class="empty"><big>'+e.split('|')[0]+'</big>'+e.split('|')[1]+'</div>'}
function renderStats(){const s=stats(),mx=Math.max(1,...s.days.map(d=>d.n)),lv=Math.floor(s.all/5)+1,nx=s.all%5;
 const names=['مبتدئ','منظّم','مركّز','محترف','أسطورة'];
 $('#main').innerHTML='<div class="grid"><div class="stat"><b>'+s.w.toLocaleString('ar-EG')+'</b><span>إنجاز الأسبوع ده</span></div><div class="stat"><b>'+s.m.toLocaleString('ar-EG')+'</b><span>إنجاز الشهر ده</span></div><div class="stat"><b>'+s.st.toLocaleString('ar-EG')+' 🔥</b><span>أيام متتالية</span></div><div class="stat"><b>'+s.spend.toLocaleString('ar-EG')+'</b><span>مصاريف الشهر (جنيه)</span></div></div>'+
 '<div class="card" style="margin-top:12px"><b>آخر ٧ أيام</b><div class="bars">'+s.days.map(d=>'<div><em>'+d.n+'</em><i style="height:'+Math.round(d.n/mx*80)+'%"></i>'+d.l+'</div>').join('')+'</div></div>'+
 '<div class="card"><b>مستواك: '+names[Math.min(lv-1,4)]+' (المستوى '+lv.toLocaleString('ar-EG')+')</b><div class="lvl"><i style="width:'+nx*20+'%"></i></div><span class="meta">'+(5-nx)+' إنجازات للمستوى الجاي · إجمالي '+s.all+' من '+s.total+'</span></div>'}
const N=x=>(+x||0).toLocaleString('ar-EG');
function renderBud(){const B=S.bud,n=new Date(),ms=+new Date(n.getFullYear(),n.getMonth(),1),ex=B.ex.filter(x=>x.d>=ms);
 const sp=c=>ex.filter(x=>x.c===c).reduce((a,x)=>a+x.a,0),tp=B.cats.reduce((a,c)=>a+c.l,0),ts=ex.reduce((a,x)=>a+x.a,0),left=B.sal-ts,free=B.sal-tp;
 $('#main').innerHTML='<div class="card"><label for="b-s" style="margin-top:0">مرتبي الشهري (جنيه)</label><input type="number" id="b-s" inputmode="decimal" value="'+(B.sal||'')+'" placeholder="اكتب المرتب كامل"></div>'+
 '<div class="grid"><div class="stat"><b>'+N(left)+'</b><span>المتبقي من المرتب</span></div><div class="stat"><b>'+N(ts)+'</b><span>اتصرف الشهر ده</span></div><div class="stat"><b>'+N(tp)+'</b><span>المخصص للأقسام</span></div><div class="stat"><b class="'+(free<0?'late':'')+'">'+N(free)+'</b><span>'+(free<0?'زيادة عن المرتب!':'لسه ماتقسمش')+'</span></div></div>'+
 '<h3 style="margin:16px 4px 8px">أقسام المصاريف</h3>'+B.cats.map(c=>{const s=sp(c.id),o=c.l&&s>c.l;return '<div class="card"><div class="tt">'+esc(c.n)+'</div><div class="lvl"><i style="width:'+(c.l?Math.min(100,s/c.l*100):0)+'%;background:'+(o?'var(--bad)':'var(--ok)')+'"></i></div><div class="meta">'+N(s)+' من '+N(c.l)+(o?' · عدّيت الحد!':'')+'</div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="number" class="bl" data-c="'+c.id+'" value="'+(c.l||'')+'" placeholder="المخصص" style="flex:1;min-width:0"><input type="number" id="a-'+c.id+'" placeholder="صرفت" style="flex:1;min-width:0"><button class="pill on" data-act="spend" data-c="'+c.id+'">＋</button></div></div>'}).join('')+
 '<div class="card"><div class="row" style="flex-wrap:nowrap"><input type="text" id="b-n" placeholder="قسم جديد (مثلًا: دروس)" style="flex:1;min-width:0"><button class="pill on" data-act="addcat">إضافة</button></div></div>'}
function renderHelp(){const m=encodeURIComponent('أهلًا، محتاج مساعدة في تطبيق ركز مع معتوق');
 $('#main').innerHTML='<div class="card"><div class="tt">💬 الدعم الفني</div><p class="note">عندك مشكلة أو اقتراح؟ كلّمنا على واتساب وهنرد عليك.</p><a class="save" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/201008500555?text='+m+'">تواصل واتساب: 01008500555</a></div><div class="card"><div class="tt">أسئلة سريعة</div><p class="note"><b>التنبيه مابيرنش؟</b> دوس على 🔔 فوق، وسيب التطبيق مفتوح أو في الخلفية.</p><p class="note"><b>بياناتي فين؟</b> محفوظة على جهازك بس.</p><p class="note"><b>الإصدار:</b> ١٫٠</p></div>'}
function openSheet(){ty='task';$('#f-t').value=$('#f-a').value=$('#f-p').value=$('#f-n').value=$('#f-f').value='';
 const d=new Date(Date.now()+36e5);d.setMinutes(0,0,0);$('#f-d').value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
 $('#f-tn').innerHTML=TONES.map((t,i)=>'<option value="'+i+'">'+t.n+'</option>').join('');
 drawTypes();$('#ov').hidden=false}
function drawTypes(){$('#types').innerHTML=Object.keys(TY).map(k=>'<button class="pill'+(k===ty?' on':'')+'" data-ty="'+k+'">'+TY[k][0]+' '+TY[k][1]+'</button>').join('')}
function readFile(f){return new Promise(r=>{if(f.type.startsWith('image/')){const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r({name:f.name,img:1,data:c.toDataURL('image/jpeg',.7)})};im.onerror=()=>r(null);im.src=URL.createObjectURL(f)}
 else if(f.size>1.2e6){toast('الملف كبير، الحد ١٫٢ ميجا');r(null)}else{const fr=new FileReader();fr.onload=()=>r({name:f.name,data:fr.result});fr.readAsDataURL(f)}})}
async function add(){const title=$('#f-t').value.trim();if(!title)return toast('اكتب العنوان الأول');
 const v=$('#f-d').value,t={id:Date.now().toString(36),title,type:ty,due:v?+new Date(v):null,rem:[...document.querySelectorAll('.rm:checked')].map(x=>x.value),tone:+$('#f-tn').value,amt:+$('#f-a').value||0,place:$('#f-p').value.trim(),note:$('#f-n').value.trim(),att:null,done:0,doneAt:0,created:Date.now()};
 const f=$('#f-f').files[0];if(f)t.att=await readFile(f);
 S.tasks.push(t);sched(t).forEach(([ts],i)=>{if(ts<=Date.now())S.fired[t.id+'_'+i]=1});
 save();$('#ov').hidden=true;tab=t.due&&t.due<sod(Date.now())+864e5?'today':'next';render();toast('اتحفظت ✓')}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();return}
 if(b.dataset.ty){ty=b.dataset.ty;drawTypes();return}
 const id=b.dataset.id,t=S.tasks.find(x=>x.id===id),a=b.dataset.act;
 if(a==='spend'){const c=b.dataset.c,v=+$('#a-'+c).value;if(!v)return toast('اكتب المبلغ');S.bud.ex.push({c,a:v,d:Date.now()});save();renderBud();toast('اتسجّل ✓')}
 if(a==='addcat'){const v=$('#b-n').value.trim();if(!v)return toast('اكتب اسم القسم');S.bud.cats.push({id:'c'+Date.now().toString(36),n:v,l:0});save();renderBud()}
 if(a==='close'){$('#ban').hidden=true}
 if(a==='done'&&t){t.done=t.done?0:1;t.doneAt=t.done?Date.now():0;if(t.done){play(4);toast(PRAISE[Math.random()*PRAISE.length|0])}$('#ban').hidden=true;save();render()}
 if(a==='del'&&t){if(b.classList.contains('sure')){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}else{b.classList.add('sure');b.textContent='اضغط تاني للتأكيد';setTimeout(()=>{b.classList.remove('sure');b.textContent='🗑 حذف'},3000)}}
 if(a==='file'&&t&&t.att){try{const bl=await (await fetch(t.att.data)).blob();window.open(URL.createObjectURL(bl),'_blank')}catch(x){toast('مقدرتش أفتح الملف هنا')}}
});
$('#fab').onclick=openSheet;$('#cn').onclick=()=>$('#ov').hidden=true;$('#sv').onclick=add;
$('#tp').onclick=()=>play(+$('#f-tn').value);
$('#bell').onclick=async()=>{play(0);try{const r=await Notification.requestPermission();toast(r==='granted'?'التنبيهات اشتغلت 🔔':'التنبيهات مقفولة من إعدادات الجهاز')}catch(e){toast('الجهاز مش بيدعم إشعارات هنا')}};
document.addEventListener('change',e=>{const i=e.target;if(i.id==='b-s'){S.bud.sal=+i.value||0;save();renderBud()}if(i.classList&&i.classList.contains('bl')){const c=S.bud.cats.find(x=>x.id===i.dataset.c);if(c){c.l=+i.value||0;save();renderBud()}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();tick();setInterval(tick,15000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
